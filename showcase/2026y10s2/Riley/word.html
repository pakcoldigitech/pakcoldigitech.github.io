    <img src="kea-removebg-preview.png"  
         alt="Flying Bird" 
         id="bird" 
         class="bird-follower">

    <script>
        const bird = document.getElementById('bird');

      
        document.addEventListener('mousemove', (e) => {
            bird.style.left = e.pageX + 'px';
            bird.style.top = e.pageY + 'px';
        });
        
    </script>
<p>
   <div id="number-box">0</div>
   

    <script>
        function decreaseNumber() {
           
            const box = document.getElementById('number-box');
            const wipers = document.getElementById('wipers');
         
            let currentNum = parseInt(box.innerText);
            
            wipers.style.position = 'fixed';
            wipers.style.top = (Math.random() * 85) + '%';
            wipers.style.right = (Math.random() * 85) + '%';
            
            if (currentNum > -6700) {
                box.innerText = currentNum + 1;
            }
        }
    </script>


    
   

   
</p>
