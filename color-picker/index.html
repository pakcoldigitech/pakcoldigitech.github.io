    output {
        vertical-align: top;
    }
    figure {
        margin: 0;
        width: 100%;
        height: calc(100% - 120px);
        transition-duration: 500ms; /* Flashing at epileptic levels without */
        background-image: repeating-conic-gradient(#222 0% 25%, #444 0% 50%);
        background-size: 32px 32px;
    }
}
.copied {
    pointer-events: none;
    opacity: 0;
    transition-property: opacity, translate;
    transition-duration: 300ms;
    position: fixed;
    translate: -50% -100%;
    background-color: white;
    padding: 5px 10px;
    border-radius: 5px;
    filter: drop-shadow(0 0 2px black);
    &::after {
        content: "";
        position: absolute;
        top: 100%;
        left: calc(50% - 10px);
        border: 10px solid transparent;
        border-top: 10px solid white;
    }
    &.show {
        opacity: 1;
        translate: -50% calc(-100% - 10px);
    }
}
main {
    position: relative;
    svg.picker * {
        transition: fill-opacity 1s;
        &:hover {
            transition: none;
            fill-opacity: 1;
        }
    }
    &::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image: radial-gradient(circle at 50% 44%, white, transparent 232px), conic-gradient(from 90deg at 50% 44% in hsl longer hue, red, red);
        mask-image: radial-gradient(circle at 50% 44%, black 232px, transparent 232px);
    }
    &::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image: conic-gradient(from 45deg at 50% 44%, black, white 270deg);
        mask-image: radial-gradient(circle at 50% 44%, transparent 245px, black 245px, black 292px, transparent 292px);
    }
}
:has(input:checked) svg.picker * {
    fill-opacity: 0;
    &:hover {
        transition: none;
        fill-opacity: 1;
    }
}

    <script type="module">
let picker = document.querySelector('svg.picker');
let palette = document.querySelector('svg.palette');
let output = document.querySelector('output');
let figure = document.querySelector('figure');
let copied = document.querySelector('.copied');

picker.addEventListener('pointerover', e => {
    if (e.target instanceof SVGPathElement) {
        e.target.parentNode.appendChild(e.target);
        palette.setAttribute('fill', e.target.getAttribute('fill'));
        output.textContent = e.target.getAttribute('fill');
        figure.style.backgroundImage = `linear-gradient(${e.target.getAttribute('fill')}`;
    }
});
let copyTimeout;
document.body.addEventListener('click', async e => {
    let el = document.elementFromPoint(event.clientX, event.clientY);
    if (el instanceof SVGPathElement && el.closest('svg').classList.contains('picker')) {
        await navigator.clipboard.writeText(el.getAttribute('fill').toLowerCase());
        copied.style.left = e.clientX + 'px';
        copied.style.top = e.clientY + 'px';
        clearTimeout(copyTimeout);
        copied.classList.add('show');
        await new Promise(r => copyTimeout = setTimeout(r, 1000));
        copied.classList.remove('show');
    }
});
    </script>
