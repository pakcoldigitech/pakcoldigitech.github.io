<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Online interactive working Alethiometer">
  <title>Alethiometer</title>
  <link rel="icon" href="alethiometer.png">
  <style>
:root {
  box-sizing: border-box;
}
* {
  box-sizing: inherit;
}
body {
  margin: 0;
  background-color: #104;
  color: lightyellow;
  display: flex;
  flex-wrap: wrap;
  place-content: space-between;
  min-height: 100vh;
}
svg {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
}
output {
  margin: 1rem 2rem;
  flex: 1 1 min-content;
  max-width: fit-content;
}
p {
  margin: 0.5rem 0;
}
#needle {
  transition: rotate 1s ease-in-out;
}
#hand-1, #hand-2, #hand-3 {
  transition: rotate 100ms ease-in-out;
}
#dial-1, #dial-2, #dial-3 {
  animation: dial 100ms steps(1) infinite alternate;
  animation-play-state: paused;
  cursor: pointer;
}
g {
  filter: drop-shadow(0 16px 0 #0004);
}
@keyframes dial {
  0% {
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
}
  </style>
  <script type="module">
let needle = document.querySelector('#needle');
let output = document.querySelector('output');

let needleOffset = 32;
// let hand1Offset = 349;
// let hand2Offset = 130;
// let hand3Offset = 249;
let questions = [1, 23, 11];
let answerFrame = undefined;

let meanings = [
  ['Hourglass', 'Time', 'Death', 'Change'],
  ['Sun', 'Day', 'Authority', 'Truth'],
  ['Alpha and Omega', 'Finality', 'Process', 'Inevitability'],
  ['Marionette', 'Obedience', 'Submission', 'Grace'],
  ['Serpent', 'Evil', 'Guile', 'Natural Wisdom'],
  ['Cauldron', 'Alchemy', 'Craft', 'Achieved Wisdom'],
  ['Anchor', 'Hope', 'Steadfastness', 'Prevention'],
  ['Angel', 'Messenger', 'Hierarchy', 'Disobedience'],
  ['Helmet', 'War', 'Protection', 'Narrow Vision'],
  ['Beehive', 'Productive Work', 'Sweetness', 'Light'],
  ['Moon', 'Chastity', 'Mystery', 'The Uncanny'],
  ['Madonna', 'Motherhood', 'The Feminine', 'Worship'],
  ['Apple', 'Sin', 'Knowledge', 'Vanity'],
  ['Bird', 'The Soul', 'Spring', 'Marriage'],
  ['Bread', 'Nourishment', 'Christ', 'Sacrifice'],
  ['Ant', 'Mechanical Work', 'Diligence', 'Tedium'],
  ['Bull', 'Earth', 'Power', 'Honesty'],
  ['Candle', 'Fire', 'Faith', 'Learning'],
  ['Cornucopia', 'Wealth', 'Autumn', 'Hospitality'],
  ['Chameleon', 'Air', 'Greed', 'Patience'],
  ['Thunderbolt', 'Inspiration', 'Fate', 'Chance'],
  ['Dolphin', 'Water', 'Resurrection', 'Succour'],
  ['Walled Garden', 'Nature', 'Innocence', 'Order'],
  ['Globe', 'Politics', 'Sovereignty', 'Fame'],
  ['Sword', 'Justice', 'Fortitude', 'The Church'],
  ['Griffin', 'Treasure', 'Watchfulness', 'Courage'],
  ['Horse', 'Europe', 'Journeys', 'Fidelity'],
  ['Camel', 'Asia', 'Summer', 'Perseverance'],
  ['Elephant', 'Africa', 'Charity', 'Continence'],
  ['Crocodile', 'America', 'Rapacity', 'Enterprise'],
  ['Baby', 'The Future', 'Malleability', 'Helpfulness'],
  ['Compass', 'Measurement', 'Mathematics', 'Science'],
  ['Lute', 'Poetry', 'Rhetoric', 'Philosophy'],
  ['Tree', 'Firmness', 'Shelter', 'Fertility'],
  ['Wild Man', 'Wild Man', 'The Masculine', 'Lust'],
  ['Owl', 'Night', 'Winter', 'Fear'],
  ['Hourglass', 'Time', 'Death', 'Change'],
];

let controller = new AbortController();
for (let i of [1,2,3]) {
  let dial = document.querySelector(`#dial-${i}`);
  let hand = document.querySelector(`#hand-${i}`);
  let pos = 0;
  dial.addEventListener('pointerdown', e => {
    controller.abort();
    dial.style.animationPlayState = 'running';
    hand.style.transition = 'none';
    let frame = requestAnimationFrame(function loop() {
      pos += e.shiftKey || e.ctrlKey ? -1 : 1;
      hand.style.rotate = `${pos}deg`;
      frame = requestAnimationFrame(loop);
    });
    addEventListener('pointerup', function pointerup() {
      dial.style.animationPlayState = 'paused';
      cancelAnimationFrame(frame);
      hand.style.transition = '';
      questions[i-1] = (Math.round(pos / 10) + [1, 23, 11][i-1]) % 36;
      pos = Math.round(pos / 10) * 10;
      hand.style.rotate = `${pos}deg`;
      controller = new AbortController();
      generateAnswer(controller.signal);
      removeEventListener('pointerup', pointerup);
    });
  });
}

// let oldPos = 32;
// while (true) {
//   await new Promise(r => setTimeout(r, Math.random() * 1000 + 1000));
//   let newPos = Math.floor(Math.random() * 36) * 10 + 32;
//   if (newPos - oldPos > 180) {
//     newPos -= 180;
//   } else if (oldPos - newPos > 180) {
//     newPos += 180;
//   }
//   needle.style.rotate = `${newPos}deg`;
//   oldPos = newPos;
// }

let oldPos = 0;
async function generateAnswer(signal) {
  let weights = [0.1, 0.3, 0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 1];
  let weight = Math.random();
  let length = weights.findIndex(w => weight <= w) + 2;
  let answers = Array(length).fill().map(_ => [Math.floor(Math.random() * 36), Math.floor(Math.random() * 3)]);

  output.innerHTML = `
  <h2>Question</h2>
    <p><strong>${meanings[questions[0]][0]}</strong>: ${meanings[questions[0]][1]}, ${meanings[questions[0]][2]}, ${meanings[questions[0]][3]}</p>
    <p><strong>${meanings[questions[1]][0]}</strong>: ${meanings[questions[1]][1]}, ${meanings[questions[1]][2]}, ${meanings[questions[1]][3]}</p>
    <p><strong>${meanings[questions[2]][0]}</strong>: ${meanings[questions[2]][1]}, ${meanings[questions[2]][2]}, ${meanings[questions[2]][3]}</p>
  <h2>Answer</h2>
  ${answers.map(([ans, i]) => `<p>
    <strong>${meanings[ans][0]}</strong>:
    ${i == 0 ? '<em>' : ''}${meanings[ans][1]}${i == 0 ? '</em>' : ''},
    ${i == 1 ? '<em>' : ''}${meanings[ans][2]}${i == 1 ? '</em>' : ''},
    ${i == 2 ? '<em>' : ''}${meanings[ans][3]}${i == 2 ? '</em>' : ''}
  </p>`).join('')}
  `;

  let clockStart = Math.random() < 0.5;
  while (!signal.aborted) {
    await new Promise(r => setTimeout(r, 2000));
    if (signal.aborted) { return; }
    let clockwise = clockStart;
    for (let [answer, pause] of answers) {
      let newPos = answer * 10 + needleOffset;
      if (clockwise) {
        while (newPos > oldPos + 360) {
          newPos -= 360;
        }
        while (newPos < oldPos) {
          newPos += 360;
        }
      } else {
        while (newPos < oldPos - 360) {
          newPos += 360;
        }
        while (newPos > oldPos) {
          newPos -= 360;
        }
      }
      oldPos = newPos;
      if (pause) {
        newPos += clockwise ? 2 : -2;
      }
      needle.style.rotate = `${newPos}deg`;
      await new Promise(r => needle.addEventListener('transitionend', r, { once: true }));
      if (signal.aborted) { return; }
      if (!pause) {
        await new Promise(r => setTimeout(r, 200));
        if (signal.aborted) { return; }
      }
      if (pause) {
        needle.style.transitionDuration = '200ms';
        clockwise = !clockwise;
        newPos += clockwise ? 4 : -4;
        needle.style.rotate = `${newPos}deg`;
        await new Promise(r => needle.addEventListener('transitionend', r, { once: true }));
        needle.style.transitionDuration = '1s';
        if (signal.aborted) { return; }
      }
      if (pause > 1) {
        needle.style.transitionDuration = '200ms';
        clockwise = !clockwise;
        newPos += clockwise ? 4 : -4;
        needle.style.rotate = `${newPos}deg`;
        await new Promise(r => needle.addEventListener('transitionend', r, { once: true }));
        needle.style.transitionDuration = '1s';
        if (signal.aborted) { return; }
      }
      clockwise = !clockwise;
    }
  }
}

generateAnswer(controller.signal);

  </script>
</head>
<body>
  <svg version="1.1" viewBox="0 0 1592 1592">
    <image id="face" x="74" y="18" width="1444" height="1556" href="Face.png"></image>
    <image id="dial-3" x="1406" y="1162" width="102" height="116" href="Dial3.png"></image>
    <image id="dial-2" x="94" y="1171" width="104" height="124" href="Dial2.png"></image>
    <image id="dial-1" x="738" y="31" width="129" height="72" href="Dial1.png"></image>
    <g>
    <image id="hand-3" transform-origin="795 843" x="672" y="750" width="506" height="241" href="Hand3.png"></image>
    <image id="hand-2" transform-origin="795 843" x="483" y="733" width="429" height="369" href="Hand2.png"></image>
    <image id="hand-1" transform-origin="795 843" x="745" y="443" width="139" height="548" href="Hand1.png"></image>
    <image id="pivot" x="752" y="800" width="86" height="86" href="Pivot.png"></image>
    <image id="needle" transform-origin="795 843" x="560" y="470" width="395" height="593" href="Needle.png"></image>
    </g>
  </svg>
  <output></output>
</body>
</html>
