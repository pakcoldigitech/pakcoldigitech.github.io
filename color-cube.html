<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="3D cube showing all the named colours">
  <title>Color Cube | Haque.rs</title>
  <link rel="shortcut icon" href="data:,"/>
  <style>
body {
  margin: 0;
  background: #555;
}
.wrap {
  perspective: 800px;
  perspective-origin: 50% 136px;
  
  margin: 48px 0 333px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cube {
  position: relative;
  width: 272px;
  transform-style: preserve-3d;
  animation: spin 5s linear infinite;
}
.face {
  position: absolute;
  width: 272px;
  height: 272px;
  opacity: 0.5;
  pointer-events: none;
}
.swatch-outer {
  position: absolute;
  transform-style: preserve-3d;
  cursor: pointer;
  transition: transform 1s ease;
}
.swatch-inner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid white;
  animation: spin 5s linear infinite reverse;
}
.back {
  transform: rotateY(180deg) translateZ(136px);
  background: linear-gradient(90deg, magenta, blue);
}
.back::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, white, cyan);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
.right {
  transform: rotateY(90deg) translateZ(136px);
  background: linear-gradient(90deg, red, magenta);
}
.right::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, yellow, white);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
.left {
  transform: rotateY(270deg) translateZ(136px);
  background: linear-gradient(90deg, blue, black);
}
.left::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, cyan, lime);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
.top {
  transform: rotateX(270deg) translateY(-136px);
  transform-origin: top center;
  background: linear-gradient(90deg, cyan, white);
}
.top::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, lime, yellow);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
.bottom {
  transform: rotateX(90deg) translateY(136px);
  transform-origin: bottom center;
  background: linear-gradient(90deg, black, red);
}
.bottom::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, blue, magenta);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
.front {
  transform: translateZ(136px);
  background: linear-gradient(90deg, black, red);
}
.front::before {
  content: '';
  display: block;
  height: 100%;
  background: linear-gradient(90deg, lime, yellow);
  -webkit-mask: linear-gradient(0deg, transparent, white);
  mask: linear-gradient(0deg, transparent, white);
}
@keyframes spin {
  from { transform: rotateY(0); }
  to { transform: rotateY(360deg); }
}

label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.25rem;
  color: white;
}
.cube.paused {
  animation-play-state: paused;
}
.cube.paused .swatch-inner {
  animation-play-state: paused;
}
.colours {
  display: flex;
  flex-flow: column-reverse wrap;
  align-content: center;
  /* height: 870px; */
  height: 780px;
  /* height: 750px; */
}
.colours.hidden {
  display: none;
}
.colours span {
  display: inline-block;
  width: 150px;
  margin: 0.25rem;
  padding: 0.25rem 0.5rem;
  border: 2px solid transparent;
  cursor: pointer;
}
.colours span.selected {
  /* outline: 4px solid white; */
  animation: selected 0.5s linear infinite alternate;
}
.swatch-outer.selected .swatch-inner {
  animation: spin 5s linear infinite reverse, selected 0.5s linear infinite alternate;
}
.cube.paused .swatch-outer.selected .swatch-inner {
  animation-play-state: paused, running;
}
@keyframes selected {
  from { outline: 0px solid white; }
  to { outline: 8px solid white; }
}

.linear .back {
  background: linear-gradient(90deg, magenta, #8000ff 78.414%, blue);
}
.linear .back::before {
  background: linear-gradient(90deg, white, #80ffff 78.414%, cyan);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
}
.linear .right {
  background: linear-gradient(90deg, red, #ff0080 21.586%, magenta);
}
.linear .right::before {
  background: linear-gradient(90deg, yellow, #ffff80 21.586%, white);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
}
.linear .left {
  background: linear-gradient(90deg, blue, #000080 78.414%, black);
}
.linear .left::before {
  background: linear-gradient(90deg, cyan, #00ff80 78.414%, lime);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
}
.linear .top {
  background: linear-gradient(90deg, cyan, #80ffff 21.586%, white);
}
.linear .top::before {
  background: linear-gradient(90deg, lime, #80ff00 21.586%, yellow);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 78.414%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 78.414%, white);
}
.linear .bottom {
  background: linear-gradient(90deg, black, #800000 21.586%, red);
}
.linear .bottom::before {
  background: linear-gradient(90deg, blue, #8000ff 21.586%, magenta);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
}
.linear .front {
  background: linear-gradient(90deg, black, #800000 21.586%, red);
}
.linear .front::before {
  background: linear-gradient(90deg, lime, #80ff00 21.586%, yellow);
  -webkit-mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
  mask: linear-gradient(0deg, transparent, #ffffff80 21.586%, white);
}
  </style>
</head>
<body>

    <div class="cube">
      <div class="face front"></div>

    Opacity:
    <input type="range" value="50" autocomplete="off">

  <label>
    <span>Linear: <input type="checkbox" autocomplete="off"></span>
  </label>
  <label>
    <span>Show colours: <input type="checkbox" autocomplete="off"></span>
  </label>
  <div class="colours hidden"></div>
  <script>
    const colours = {

      Azure: [240, 255, 255],
      MintCream: [245, 255, 250],
      Snow: [255, 250, 250],
      Ivory: [255, 255, 240],
      White: [255, 255, 255],
      Black: [0, 0, 0],
      DarkSlateGray: [47, 79, 79],
      DimGray: [105, 105, 105],
      SlateGray: [112, 128, 144],
      Gray: [128, 128, 128],
      LightSlateGray: [119, 136, 153],
      DarkGray: [169, 169, 169],
      Silver: [192, 192, 192],
      LightGray: [211, 211, 211],
      Gainsboro: [220, 220, 220],
    }

    // This code was written before functions like groupBy(),
    // :has() and contrast-color() existed.
    // It has been edited very little since then.
    // It mostly just places the colours in the correct spots.
    // This whole file could be redone without javascript,
    // except perhaps the opacity slider.
    // The listed order of colours is essentially random and eyeballed.

    Object.entries(colours).forEach(([k, v]) => {
      const outer = document.createElement('div');
      const inner = document.createElement('div');
      outer.classList.add('swatch-outer');
      inner.classList.add('swatch-inner');
      // inner.style.background = `rgb(${v[0]},${v[1]},${v[2]})`;
      inner.style.background = k.toLowerCase();

      let [r,g,b] = v;

      outer.style.transform = `translate3d(${r}px, ${255 - g}px, ${255 - b - 128}px)`;
      outer.title = k;
      outer.addEventListener('click', () => {
        document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
        outer.classList.add('selected');
        [...document.querySelectorAll('.colours span')].find(span => span.textContent == k)?.classList.add('selected');
      });
      outer.appendChild(inner);
      document.querySelector('.cube').appendChild(outer);
    });

    Object.entries(colours)
    .filter(([k, v]) => !['AquaXX', 'FuchsiaXX', 'Black'].includes(k)/* && !k.includes('Gray')*/)
    // Sort by H then S then L:
    .sort(([ak, av], [bk, bv]) => rgbToHsl(av)[0] > rgbToHsl(bv)[0] ? 1 : rgbToHsl(av)[0] < rgbToHsl(bv)[0] ? -1 : (
      rgbToHsl(av)[1] > rgbToHsl(bv)[1] ? 1 : rgbToHsl(av)[1] < rgbToHsl(bv)[1] ? -1 : (0
        // rgbToHsl(av)[2] > rgbToHsl(bv)[2] ? 1 : rgbToHsl(av)[2] < rgbToHsl(bv)[2] ? -1 : 0
      )
    ))
    // Group:
    .reduce((acc, c, i) => ((acc[i/20|0]??=[]).push(c), acc), [])
    // Sort each group by L:
    .map((g, i) => g.sort(([ak, av], [bk, bv]) =>
      luminance(av) > luminance(bv) ? 1 : luminance(av) < luminance(bv) ? -1 : 0
    )).flat()
    .forEach(([k, v]) => {
      const swatch = document.createElement('span');
      // swatch.style.background = `rgb(${v[0]},${v[1]},${v[2]})`;
      swatch.style.background = k.toLowerCase();
      swatch.textContent = k// + ` (${luminance(v).toFixed(4)})`;
      swatch.style.color = bw(v);
      swatch.style.color = `contrast-color(${k})`;
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
        swatch.classList.add('selected');
        document.querySelector(`[title="${k}"]`).classList.add('selected');
      });
      document.querySelector('.colours').appendChild(swatch);
    });

    document.querySelector('input[type=range]').addEventListener('input', e => {
      document.querySelectorAll('.face').forEach(face => face.style.opacity = e.target.value / 100);
    });

    document.querySelector('input[type=checkbox]').addEventListener('input', e => {
      document.querySelector('.cube').classList.toggle('paused', e.target.checked);
    });

    document.querySelectorAll('input[type=checkbox]')[1].addEventListener('input', e => {
      document.querySelector('.cube').classList.toggle('linear', e.target.checked);
      Object.entries(colours).forEach(([k, v]) => {
        const outer = document.querySelector(`.swatch-outer[title="${k}"]`);
        const inner = outer.querySelector('.swatch-inner');

        let [r,g,b] = v.map(cc => cc/255);
        if (e.target.checked) {
          r = r <= 0.03928 ? r / 12.92 : ((r + 0.055) / 1.055) ** 2.4;
          g = g <= 0.03928 ? g / 12.92 : ((g + 0.055) / 1.055) ** 2.4;
          b = b <= 0.03928 ? b / 12.92 : ((b + 0.055) / 1.055) ** 2.4;
        }
        [r,g,b] = [r,g,b].map(cc => cc*255);

        outer.style.transform = `translate3d(${r}px, ${255 - g}px, ${255 - b - 128}px)`;
      });
    });
    
    document.querySelectorAll('input[type=checkbox]')[2].addEventListener('input', e => {
      document.querySelector('.colours').classList.toggle('hidden', !e.target.checked);
    });

    function rgbToHsl([r, g, b]){
      r /= 255, g /= 255, b /= 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h, s, l = (max + min) / 2;
      if (max == min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max){
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      if (s == 0) { h = 260/360; } // Pick a hue for the achromatics
      return [h, s, l];
    }
    function luminance(c) {
      let [r,g,b] = c.map(cc => cc/255);
      r = r <= 0.03928 ? r / 12.92 : ((r + 0.055) / 1.055) ** 2.4;
      g = g <= 0.03928 ? g / 12.92 : ((g + 0.055) / 1.055) ** 2.4;
      b = b <= 0.03928 ? b / 12.92 : ((b + 0.055) / 1.055) ** 2.4;
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function contrast(c, d) {
      let result = (luminance(c) + 0.05) / (luminance(d) + 0.05);
      if (result < 1) { result = 1 / result; }
      return result;
    }
    function bw(c) {
      return contrast(c, [0,0,0]) < contrast(c, [255,255,255]) ? 'white' : 'black';
    }
